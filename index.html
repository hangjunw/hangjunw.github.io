
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湖州学院开票信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(120deg, #2c3e50, #3498db);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            animation: fadeInDown 1s ease;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- 头部 -->
        <header class="text-center mb-10 animate-fade-in">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">欢迎来到白蚁世界！</h1>
            <div class="w-24 h-1 bg-gradient-to-r from-blue-500 to-purple-600 mx-auto rounded-full"></div>
        </header>

        <!-- 主要内容区域 -->
        <main class="space-y-8">
            <!-- 开票信息板块 -->
            <section class="bg-white rounded-2xl shadow-xl overflow-hidden info-card">
                <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6">
                    <h2 class="text-2xl font-bold text-white flex items-center">
                        <i class="fas fa-file-invoice mr-3"></i>湖州学院开票信息
                    </h2>
                </div>
                <div class="p-6 space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-blue-50 rounded-lg border-l-4 border-blue-500">
                        <div class="mb-2 sm:mb-0">
                            <span class="font-semibold text-gray-700">单位名称：</span>
                            <span class="text-gray-600" id="unit-name">湖州学院</span>
                        </div>
                        <button onclick="copyInfo('湖州学院')" class="copy-btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-copy mr-2"></i>复制
                        </button>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-green-50 rounded-lg border-l-4 border-green-500">
                        <div class="mb-2 sm:mb-0">
                            <span class="font-semibold text-gray-700">统一社会信用代码:</span>
                            <span class="text-gray-600" id="credit-code">12330500774395886K</span>
                        </div>
                        <button onclick="copyInfo('12330500774395886K')" class="copy-btn bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-copy mr-2"></i>复制
                        </button>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-yellow-50 rounded-lg border-l-4 border-yellow-500">
                        <div class="mb-2 sm:mb-0">
                            <span class="font-semibold text-gray-700">地址:</span>
                            <span class="text-gray-600" id="address">湖州市吴兴区妙峰山北路999号</span>
                        </div>
                        <button onclick="copyInfo('湖州市吴兴区妙峰山北路999号')" class="copy-btn bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-copy mr-2"></i>复制
                        </button>
                    </div>
                </div>
            </section>

            <!-- 账户信息板块 -->
            <section class="bg-white rounded-2xl shadow-xl overflow-hidden info-card">
                <div class="bg-gradient-to-r from-purple-600 to-pink-700 p-6">
                    <h2 class="text-2xl font-bold text-white flex items-center">
                        <i class="fas fa-university mr-3"></i>湖州学院账户信息
                    </h2>
                </div>
                <div class="p-6 space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-purple-50 rounded-lg border-l-4 border-purple-500">
                        <div class="mb-2 sm:mb-0">
                            <span class="font-semibold text-gray-700">单位名称（基本户）：</span>
                            <span class="text-gray-600" id="account-unit-name">湖州学院</span>
                        </div>
                        <button onclick="copyInfo('湖州学院')" class="copy-btn bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-copy mr-2"></i>复制
                        </button>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-red-50 rounded-lg border-l-4 border-red-500">
                        <div class="mb-2 sm:mb-0">
                            <span class="font-semibold text-gray-700">开户行名称：</span>
                            <span class="text-gray-600" id="bank-name">中国农业银行湖州经济开发区支行</span>
                        </div>
                        <button onclick="copyInfo('中国农业银行湖州经济开发区支行')" class="copy-btn bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-copy mr-2"></i>复制
                        </button>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-indigo-50 rounded-lg border-l-4 border-indigo-500">
                        <div class="mb-2 sm:mb-0">
                            <span class="font-semibold text-gray-700">银行账号:</span>
                            <span class="text-gray-600" id="bank-account">19105101040231896</span>
                        </div>
                        <button onclick="copyInfo('19105101040231896')" class="copy-btn bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-copy mr-2"></i>复制
                        </button>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-teal-50 rounded-lg border-l-4 border-teal-500">
                        <div class="mb-2 sm:mb-0">
                            <span class="font-semibold text-gray-700">联行号:</span>
                            <span class="text-gray-600" id="bank-code">103336010513</span>
                        </div>
                        <button onclick="copyInfo('103336010513')" class="copy-btn bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-copy mr-2"></i>复制
                        </button>
                    </div>
                </div>
            </section>

            <!-- 一键复制全部信息 -->
            <div class="text-center mt-8">
                <button onclick="copyAllInfo()" class="copy-btn bg-gradient-to-r from-green-500 to-teal-600 hover:from-green-600 hover:to-teal-700 text-white font-bold py-3 px-8 rounded-full shadow-lg flex items-center mx-auto">
                    <i class="fas fa-copy mr-3"></i>一键复制全部开票信息
                </button>
            </div>
        </main>

        <!-- 通知栏 -->
        <div id="notification" class="notification fixed top-4 right-4 bg-green-500 text-white py-3 px-6 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 z-50">
            <div class="flex items-center">
                <i class="fas fa-check-circle mr-2"></i>
                <span>信息已复制到剪贴板!</span>
            </div>
        </div>

    </div>

    <script>
        // 显示通知函数
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.classList.remove('translate-x-full');
            notification.classList.add('translate-x-0');
            
            setTimeout(() => {
                notification.classList.remove('translate-x-0');
                notification.classList.add('translate-x-full');
            }, 2000);
        }

        // 复制单条信息
        function copyInfo(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification();
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动选择文本复制');
            });
        }

        // 复制全部信息
        function copyAllInfo() {
            const allInfo = `
湖州学院开票信息

单位名称：湖州学院
统一社会信用代码: 12330500774395886K
地址: 湖州市吴兴区妙峰山北路999号

湖州学院账户信息

单位名称（基本户）：湖州学院
开户行名称：中国农业银行湖州经济开发区支行
银行账号: 19105101040231896
联行号: 103336010513
            `.trim();

            navigator.clipboard.writeText(allInfo).then(() => {
                showNotification();
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动选择文本复制');
            });
        }

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const sections = document.querySelectorAll('section');
            sections.forEach((section, index) => {
                section.style.opacity = '0';
                section.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    section.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    section.style.opacity = '1';
                    section.style.transform = 'translateY(0)';
                }, 200 * index);
            });
        });
    </script>
</body>
</html>
